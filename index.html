<script>
    // ============================================================
    //  CONFIG
    // ============================================================
    const DEV_WALLET = "BLKj7mTgRa9Fg1vCDqZeNaBSjyekF4xpK72fMWikZYmq";
    const HARD_CAP = 3000;
    const REF_BONUS = 0.05;
    const TIERS = [
        { raised: 0, tokensPerSol: 280000 },
        { raised: 900, tokensPerSol: 230000 },
        { raised: 1800, tokensPerSol: 180000 },
        { raised: 2500, tokensPerSol: 140000 }
    ];

    // Try original first, then fallbacks
    const RPC_ENDPOINTS = [
        'https://api.mainnet-beta.solana.com',           // original
        'https://solana-api.projectserum.com',
        'https://rpc.ankr.com/solana',
        'https://solana.publicnode.com'
    ];

    // ============================================================
    //  STATE
    // ============================================================
    let totalRaised = 2439;
    let buyerCount = 3243;
    let recentPurchases = [];
    let publicKey = null;
    let connection = null;
    let wallet = null;
    let currentBalance = 0;
    let isFetchingBalance = false;

    // ============================================================
    //  DOM REFS
    // ============================================================
    const $ = id => document.getElementById(id);
    const walletShortAddr = $('walletShortAddr');
    const balanceDisplay = $('balanceDisplay');
    const balanceErrorMsg = $('balanceErrorMsg');
    const refreshBalanceBtn = $('refreshBalanceBtn');
    const walletPromptArea = $('walletPromptArea');
    const walletInfoArea = $('walletInfoArea');
    const buyBtn = $('buyTokenBtn');
    const solInput = $('solAmountInput');
    const refInput = $('referralCodeInput');
    const baseTokenPreview = $('baseTokenPreviewVal');
    const bonusPreviewRow = $('bonusPreviewRow');
    const bonusTokenVal = $('bonusTokenVal');
    const totalTokenFinal = $('totalTokenFinal');
    const pricePerSolDisplay = $('pricePerSolDisplay');
    const progressPercent = $('progressPercent');
    const progressFillBar = $('progressFillBar');
    const currentRaisedDisplay = $('currentRaisedDisplay');
    const totalRaisedDisplay = $('totalRaisedDisplay');
    const totalBuyersDisplay = $('totalBuyersDisplay');
    const transactionMsg = $('transactionMessage');

    // ============================================================
    //  HELPERS
    // ============================================================
    function randomWalletEnding() {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let r = '';
        for (let i = 0; i < 4; i++) r += chars[Math.floor(Math.random() * chars.length)];
        return r;
    }

    function getCurrentTier() {
        for (let i = TIERS.length - 1; i >= 0; i--) {
            if (totalRaised >= TIERS[i].raised) return TIERS[i];
        }
        return TIERS[0];
    }

    function formatNumber(n) {
        return n.toLocaleString();
    }

    // ============================================================
    //  RPC CONNECTION (with timeout)
    // ============================================================
    async function createConnectionWithFallback() {
        if (typeof solanaWeb3 === 'undefined') {
            throw new Error('Solana Web3 library not loaded');
        }

        for (const endpoint of RPC_ENDPOINTS) {
            try {
                console.log(`🔄 Trying RPC: ${endpoint}`);
                const conn = new solanaWeb3.Connection(endpoint, 'confirmed');
                // Test with a short timeout
                const slot = await Promise.race([
                    conn.getSlot(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 5000))
                ]);
                console.log(`✅ RPC connected: ${endpoint} (slot ${slot})`);
                return conn;
            } catch (e) {
                console.warn(`⚠️ RPC ${endpoint} failed:`, e.message);
                continue;
            }
        }
        throw new Error('All RPC endpoints failed');
    }

    // ============================================================
    //  BALANCE FETCH (with retry and clear feedback)
    // ============================================================
    async function fetchBalance(showLoading = true) {
        if (!publicKey) {
            console.warn('No public key');
            return;
        }
        if (isFetchingBalance) return;
        isFetchingBalance = true;

        // Ensure we have a working connection
        if (!connection) {
            try {
                connection = await createConnectionWithFallback();
            } catch (e) {
                console.error('Cannot create connection for balance:', e);
                balanceDisplay.innerText = '⚠️ No RPC';
                balanceErrorMsg.innerText = 'Network error. Tap ↻ to retry.';
                balanceErrorMsg.classList.remove('hidden');
                isFetchingBalance = false;
                return;
            }
        }

        if (showLoading) {
            balanceDisplay.innerHTML = '<span class="balance-loading">⟳</span> 0.0000 SOL';
        }
        balanceErrorMsg.classList.add('hidden');
        refreshBalanceBtn.disabled = true;

        let success = false;
        let lastError = null;

        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                const pubKey = new solanaWeb3.PublicKey(publicKey);
                const lamports = await connection.getBalance(pubKey);
                currentBalance = lamports / solanaWeb3.LAMPORTS_PER_SOL;
                balanceDisplay.innerText = currentBalance.toFixed(4) + ' SOL';
                console.log(`💰 Balance: ${currentBalance.toFixed(4)} SOL`);
                balanceErrorMsg.classList.add('hidden');
                success = true;
                break;
            } catch (err) {
                lastError = err;
                console.warn(`Balance attempt ${attempt}/3 failed:`, err.message);
                // If connection seems dead, recreate it
                if (err.message.includes('Failed to fetch') || err.message.includes('Timeout')) {
                    try {
                        connection = await createConnectionWithFallback();
                    } catch (reconnErr) {
                        console.warn('Reconnection failed:', reconnErr.message);
                    }
                }
                await new Promise(r => setTimeout(r, 800 * attempt));
            }
        }

        if (!success) {
            console.error('All balance attempts failed:', lastError?.message);
            balanceDisplay.innerText = '⚠️ Error';
            balanceErrorMsg.innerText = `Could not fetch balance. ${lastError?.message || 'Tap ↻ to retry.'}`;
            balanceErrorMsg.classList.remove('hidden');
            currentBalance = 0;
        }

        isFetchingBalance = false;
        refreshBalanceBtn.disabled = false;
        updateTokenUI();
    }

    // ============================================================
    //  WALLET CONNECTION
    // ============================================================
    async function connectWallet() {
        if (!window.solana || !window.solana.isPhantom) {
            alert('Please install Phantom wallet from phantom.app');
            window.open('https://phantom.app/', '_blank');
            return;
        }

        wallet = window.solana;

        try {
            let resp;
            if (wallet.isConnected) {
                resp = await wallet.connect({ onlyIfTrusted: true });
            } else {
                resp = await wallet.connect();
            }
            publicKey = resp.publicKey.toString();
            walletShortAddr.innerText = publicKey.slice(0, 4) + '...' + publicKey.slice(-4);
            walletPromptArea.classList.add('hidden');
            walletInfoArea.classList.remove('hidden');

            // Establish RPC connection
            try {
                connection = await createConnectionWithFallback();
            } catch (connErr) {
                console.error('RPC connection error:', connErr);
                alert('Network error: could not connect to Solana. Please try again or use a different RPC.');
                return;
            }

            // Fetch initial balance
            await fetchBalance(true);

            // Listen for account changes
            if (wallet.on) {
                wallet.on('accountChanged', (newPubkey) => {
                    if (newPubkey) {
                        publicKey = newPubkey.toString();
                        walletShortAddr.innerText = publicKey.slice(0, 4) + '...' + publicKey.slice(-4);
                        fetchBalance(true);
                        updateTokenUI();
                    } else {
                        disconnect();
                    }
                });
                wallet.on('disconnect', () => disconnect());
            }

            updateTokenUI();

        } catch (err) {
            console.error('Wallet connection error:', err);
            alert('Failed to connect wallet: ' + err.message);
        }
    }

    function disconnect() {
        if (wallet) {
            try { wallet.disconnect(); } catch (e) {}
        }
        publicKey = null;
        connection = null;
        currentBalance = 0;
        walletPromptArea.classList.remove('hidden');
        walletInfoArea.classList.add('hidden');
        balanceDisplay.innerText = '0.0000 SOL';
        balanceErrorMsg.classList.add('hidden');
        updateTokenUI();
    }

    // ============================================================
    //  UI UPDATES
    // ============================================================
    function updateTokenUI() {
        const amt = parseFloat(solInput.value) || 0;
        const tier = getCurrentTier();
        const base = Math.floor(amt * tier.tokensPerSol);
        const hasRef = refInput.value.trim().length > 0;
        const bonus = hasRef ? Math.floor(base * REF_BONUS) : 0;
        const total = base + bonus;

        baseTokenPreview.innerText = formatNumber(base);
        if (hasRef && bonus > 0) {
            bonusPreviewRow.classList.remove('hidden');
            bonusTokenVal.innerText = '+' + formatNumber(bonus);
        } else {
            bonusPreviewRow.classList.add('hidden');
        }
        totalTokenFinal.innerText = formatNumber(total);

        pricePerSolDisplay.innerText = (tier.tokensPerSol / 1000).toFixed(0) + 'K';

        if (!publicKey) {
            buyBtn.disabled = true;
            buyBtn.innerText = 'Connect wallet to buy';
        } else if (amt < 0.5) {
            buyBtn.disabled = true;
            buyBtn.innerText = 'Minimum 0.5 SOL';
        } else if (amt > 500) {
            buyBtn.disabled = true;
            buyBtn.innerText = 'Maximum 500 SOL';
        } else if (currentBalance < amt) {
            buyBtn.disabled = true;
            buyBtn.innerText = `Insufficient balance (${currentBalance.toFixed(2)} SOL)`;
        } else {
            buyBtn.disabled = false;
            buyBtn.innerText = 'Buy $LIZZY';
        }
    }

    function updateStatsUI() {
        const percent = Math.min((totalRaised / HARD_CAP) * 100, 100);
        totalRaisedDisplay.innerText = totalRaised.toFixed(2);
        currentRaisedDisplay.innerText = totalRaised.toFixed(2) + ' SOL';
        totalBuyersDisplay.innerText = buyerCount;
        progressPercent.innerText = percent.toFixed(1) + '%';
        progressFillBar.style.width = percent + '%';
        updateTokenUI();
    }

    // ============================================================
    //  RECENT PURCHASES
    // ============================================================
    function addRecentPurchase(amt, walletSuffix) {
        const tier = getCurrentTier();
        const tokens = Math.floor(amt * tier.tokensPerSol);
        const suffix = walletSuffix || randomWalletEnding();
        recentPurchases.unshift({
            amount: amt.toFixed(2),
            tokens,
            wallet: '...' + suffix,
            time: 'just now',
            isNew: true
        });
        if (recentPurchases.length > 8) recentPurchases.pop();
        renderRecentPurchases();
        setTimeout(() => {
            recentPurchases.forEach(p => p.isNew = false);
            renderRecentPurchases();
        }, 3000);
    }

    function renderRecentPurchases() {
        const container = $('recentPurchasesList');
        if (recentPurchases.length === 0) {
            for (let i = 0; i < 4; i++) {
                const fakeAmt = (Math.random() * 10 + 0.5);
                const fakeTokens = Math.floor(fakeAmt * getCurrentTier().tokensPerSol);
                recentPurchases.push({
                    amount: fakeAmt.toFixed(1),
                    tokens: fakeTokens,
                    wallet: '...' + randomWalletEnding(),
                    time: (i + 2) + ' min ago',
                    isNew: false
                });
            }
        }
        container.innerHTML = recentPurchases.map(p => `
            <div class="recent-item flex justify-between items-center p-2 bg-white/60 rounded-lg border-l-4 border-[#BAD668] ${p.isNew ? 'bg-[#BAD668]/20' : ''}">
                <div class="flex items-center gap-2"><i class="fas fa-user text-[#C46B60] text-xs"></i><span class="wallet-address text-sm">${p.wallet}</span></div>
                <div class="text-right"><div class="font-bold text-sm">${p.amount} SOL</div><div class="text-xs text-[#C46B60]">${formatNumber(p.tokens)} LIZZY</div></div>
            </div>
        `).join('');
    }

    // ============================================================
    //  BUY TOKENS
    // ============================================================
    async function buyTokens() {
        if (!publicKey) return;
        const amount = parseFloat(solInput.value);
        if (amount < 0.5 || amount > 500) return;
        if (currentBalance < amount) {
            alert('Insufficient balance');
            return;
        }

        buyBtn.disabled = true;
        buyBtn.innerText = 'Processing...';
        transactionMsg.classList.add('hidden');

        try {
            const { blockhash } = await connection.getLatestBlockhash();
            const tx = new solanaWeb3.Transaction().add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: new solanaWeb3.PublicKey(publicKey),
                    toPubkey: new solanaWeb3.PublicKey(DEV_WALLET),
                    lamports: Math.floor(amount * solanaWeb3.LAMPORTS_PER_SOL)
                })
            );
            tx.recentBlockhash = blockhash;
            tx.feePayer = new solanaWeb3.PublicKey(publicKey);

            const signed = await wallet.signTransaction(tx);
            const sig = await connection.sendRawTransaction(signed.serialize());
            await connection.confirmTransaction(sig, 'confirmed');

            totalRaised += amount;
            buyerCount++;
            updateStatsUI();
            addRecentPurchase(amount, publicKey.slice(-4));

            transactionMsg.innerHTML =
                `<div class="text-green-700 bg-green-50 p-2 rounded-xl text-xs">✓ Success! ${formatNumber(Math.floor(amount * getCurrentTier().tokensPerSol))} LIZZY reserved. <a href="https://explorer.solana.com/tx/${sig}" target="_blank" class="underline">View tx</a></div>`;
            transactionMsg.classList.remove('hidden');

            setTimeout(() => fetchBalance(true), 2000);

        } catch (err) {
            console.error('Transaction error:', err);
            transactionMsg.innerHTML =
                `<div class="text-red-600 bg-red-50 p-2 rounded-xl text-xs">✗ ${err.message.slice(0, 100)}</div>`;
            transactionMsg.classList.remove('hidden');
        } finally {
            buyBtn.disabled = false;
            buyBtn.innerText = 'Buy $LIZZY';
            updateTokenUI();
            setTimeout(() => {
                transactionMsg.classList.add('hidden');
            }, 6000);
        }
    }

    // ============================================================
    //  SIMULATE LIVE ACTIVITY
    // ============================================================
    function simulateLiveActivity() {
        setInterval(() => {
            if (totalRaised < HARD_CAP && Math.random() > 0.65) {
                const fakeAmount = +(Math.random() * 2 + 0.5).toFixed(2);
                totalRaised = Math.min(totalRaised + fakeAmount, HARD_CAP);
                if (Math.random() > 0.7) buyerCount++;
                updateStatsUI();
                addRecentPurchase(fakeAmount, null);
            }
        }, 15000);
    }

    // ============================================================
    //  COUNTDOWN
    // ============================================================
    function startCountdown() {
        const targetDate = new Date('August 02, 2026 20:00:00 GMT-0500').getTime();

        function update() {
            const now = Date.now();
            const dist = targetDate - now;
            if (dist < 0) {
                ['countdownDays', 'countdownHours', 'countdownMins', 'countdownSecs'].forEach(id => $(id).innerText = '00');
                return;
            }
            const d = Math.floor(dist / (1000 * 60 * 60 * 24));
            const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((dist % (1000 * 60)) / 1000);
            $('countdownDays').innerText = String(d).padStart(2, '0');
            $('countdownHours').innerText = String(h).padStart(2, '0');
            $('countdownMins').innerText = String(m).padStart(2, '0');
            $('countdownSecs').innerText = String(s).padStart(2, '0');
        }
        update();
        setInterval(update, 1000);
    }

    // ============================================================
    //  MOBILE WALLET HELPERS
    // ============================================================
    function setupMobileWalletButtons() {
        const openBtn = $('openInPhantomBtn');
        const installBtn = $('installPhantomBtn');
        if (openBtn) {
            openBtn.addEventListener('click', () => {
                window.location.href = 'https://phantom.app/ul/browse/' + encodeURIComponent(window.location.href);
            });
        }
        if (installBtn) {
            installBtn.addEventListener('click', () => {
                window.open('https://phantom.app/download', '_blank');
            });
        }
    }

    // ============================================================
    //  INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
        startCountdown();
        setupMobileWalletButtons();
        renderRecentPurchases();
        updateStatsUI();
        simulateLiveActivity();

        $('connectWalletNavBtn').addEventListener('click', connectWallet);
        $('presaleConnectBtnInline').addEventListener('click', connectWallet);
        $('disconnectWalletBtn').addEventListener('click', disconnect);
        buyBtn.addEventListener('click', buyTokens);

        solInput.addEventListener('input', updateTokenUI);
        refInput.addEventListener('input', updateTokenUI);

        document.querySelectorAll('.quickAmountBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                solInput.value = btn.dataset.quick;
                updateTokenUI();
            });
        });

        refreshBalanceBtn.addEventListener('click', () => {
            if (publicKey) {
                // Force re-establish connection if needed
                if (!connection) {
                    createConnectionWithFallback().then(conn => {
                        connection = conn;
                        fetchBalance(true);
                    }).catch(err => {
                        console.error('Reconnect failed:', err);
                        alert('Cannot reconnect to Solana network.');
                    });
                } else {
                    fetchBalance(true);
                }
            }
        });

        // Chart
        const ctx = document.getElementById('lizzyTokenChart')?.getContext('2d');
        if (ctx) {
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Presale 40%', 'Liquidity 30%', 'Marketing 15%', 'Community 10%', 'Lizzy Reserve 5%'],
                    datasets: [{
                        data: [40, 30, 15, 10, 5],
                        backgroundColor: ['#C46B60', '#BAD668', '#E8E8E1', '#442A1D', '#DC8B70'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 10,
                                font: { size: 10 }
                            }
                        }
                    }
                }
            });
        }

        // Auto-connect if wallet already connected
        if (window.solana && window.solana.isConnected) {
            try {
                const resp = await window.solana.connect({ onlyIfTrusted: true });
                publicKey = resp.publicKey.toString();
                wallet = window.solana;
                walletShortAddr.innerText = publicKey.slice(0, 4) + '...' + publicKey.slice(-4);
                walletPromptArea.classList.add('hidden');
                walletInfoArea.classList.remove('hidden');
                connection = await createConnectionWithFallback();
                await fetchBalance(true);
                updateTokenUI();
            } catch (e) {
                console.log('Auto-connect skipped:', e.message);
            }
        }
    });
</script>
