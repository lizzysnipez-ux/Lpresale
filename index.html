<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buffer Test</title>

    <!-- 1. YOUR SELF-HOSTED BUNDLE -->
    <script src="./buffer-bundle.js"></script>
    <script>
        if (typeof Buffer === 'undefined') {
            window.Buffer = require('buffer').Buffer;
        }
        // Verification log
        console.log('Buffer type:', typeof Buffer);
        console.log('Buffer.from type:', typeof Buffer.from);
    </script>

    <!-- 2. WEB3.JS -->
    <script src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.js"></script>
</head>
<body>
    <button id="testBtn">Test Transaction Build</button>
    <script>
        document.getElementById('testBtn').onclick = async () => {
            try {
                // This line is what usually fails without a proper Buffer
                const instruction = solanaWeb3.SystemProgram.transfer({
                    fromPubkey: new solanaWeb3.PublicKey("11111111111111111111111111111111"),
                    toPubkey: new solanaWeb3.PublicKey("11111111111111111111111111111111"),
                    lamports: 1000
                });
                console.log('✅ Transaction instruction built successfully!', instruction);
                alert('Success! Check the console.');
            } catch (e) {
                console.error('❌ Error:', e);
                alert('Failed: ' + e.message);
            }
        };
    </script>
</body>
</html>
